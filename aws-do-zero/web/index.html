<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — aws do zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --breu:#16132A;
    --placa:#211D3C;
    --placa-alta:#2A2549;
    --sulco:#352F5C;
    --giz:#EDE9FA;
    --bruma:#948CBB;
    --ambar:#FFB03A;
    --menta:#5FE3A8;
    --rosa:#FF6B8A;
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --corpo:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--breu);
    color:var(--giz);
    font-family:var(--corpo);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .casca{
    max-width:1080px;
    margin:0 auto;
    padding:32px 20px 80px;
    display:grid;
    grid-template-columns:64px 1fr;
    gap:32px;
    align-items:start;
  }
  /* ---- espinha: marcadores de estado por questão ---- */
  .espinha{
    position:sticky;top:32px;
    display:flex;flex-direction:column;gap:6px;align-items:center;
  }
  .espinha .rotulo{
    font-family:var(--mono);font-size:11px;color:var(--bruma);
    letter-spacing:.08em;margin-bottom:6px;
  }
  .vertebra{
    width:26px;height:26px;border-radius:7px;
    border:1.5px solid var(--sulco);background:transparent;
    font-family:var(--mono);font-size:11px;color:var(--bruma);
    display:grid;place-items:center;padding:0;cursor:default;
    transition:background .25s,border-color .25s,color .25s,transform .25s;
  }
  .vertebra.atual{border-color:var(--ambar);color:var(--ambar);transform:scale(1.14)}
  .vertebra.certa{background:var(--menta);border-color:var(--menta);color:var(--breu)}
  .vertebra.errada{background:var(--rosa);border-color:var(--rosa);color:var(--breu)}
  .placar{
    font-family:var(--mono);font-size:12px;color:var(--bruma);
    margin-top:10px;text-align:center;
  }
  /* ---- cabeçalho ---- */
  header{margin-bottom:28px}
  .marca{
    font-family:var(--display);
    font-weight:800;font-size:clamp(28px,5vw,40px);
    letter-spacing:-.02em;line-height:1.05;margin:0 0 4px;
  }
  .marca em{font-style:normal;color:var(--ambar)}
  .sub{color:var(--bruma);font-size:14px;margin:0}
  /* ---- seletor de módulo ---- */
  .modulos{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 8px}
  .chip{
    font-family:var(--mono);font-size:12px;
    background:var(--placa);color:var(--giz);
    border:1.5px solid var(--sulco);border-radius:9px;
    padding:8px 13px;cursor:pointer;
    transition:border-color .2s,background .2s,color .2s;
  }
  .chip:hover{border-color:var(--ambar)}
  .chip[aria-pressed="true"]{background:var(--ambar);border-color:var(--ambar);color:var(--breu);font-weight:500}
  .chip:disabled{opacity:.35;cursor:not-allowed;border-style:dashed}
  .chip:disabled:hover{border-color:var(--sulco)}
  .acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .botao{
    font-family:var(--corpo);font-size:15px;font-weight:600;
    background:var(--ambar);color:var(--breu);
    border:none;border-radius:10px;padding:12px 22px;cursor:pointer;
    transition:filter .2s,transform .1s;
  }
  .botao:hover{filter:brightness(1.12)}
  .botao:active{transform:translateY(1px)}
  .botao.vazado{background:transparent;color:var(--giz);border:1.5px solid var(--sulco)}
  .botao.vazado:hover{border-color:var(--ambar);filter:none}
  .botao:disabled{opacity:.4;cursor:not-allowed}
  /* ---- questão ---- */
  .cartao{
    background:var(--placa);border:1px solid var(--sulco);
    border-radius:16px;padding:26px;margin-top:8px;
  }
  .meta{
    font-family:var(--mono);font-size:11px;color:var(--bruma);
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;
    display:flex;flex-wrap:wrap;gap:6px 14px;
  }
  .enunciado{
    font-family:var(--display);font-weight:600;
    font-size:clamp(19px,2.6vw,24px);line-height:1.35;
    letter-spacing:-.01em;margin:0 0 22px;
  }
  .alternativas{display:flex;flex-direction:column;gap:10px}
  .alt{
    display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
    background:var(--placa-alta);color:var(--giz);
    border:1.5px solid transparent;border-radius:11px;
    padding:14px 16px;cursor:pointer;font:inherit;line-height:1.5;
    transition:border-color .18s,background .18s,transform .1s;
  }
  .alt:hover:not(:disabled){border-color:var(--ambar)}
  .alt:active:not(:disabled){transform:translateY(1px)}
  .alt:disabled{cursor:default}
  .alt .letra{
    font-family:var(--mono);font-size:12px;font-weight:500;
    flex:0 0 24px;height:24px;border-radius:6px;
    background:var(--sulco);color:var(--giz);
    display:grid;place-items:center;margin-top:1px;
  }
  .alt.marcada{border-color:var(--ambar)}
  .alt.marcada .letra{background:var(--ambar);color:var(--breu)}
  .alt.certa{border-color:var(--menta);background:rgba(95,227,168,.09)}
  .alt.certa .letra{background:var(--menta);color:var(--breu)}
  .alt.errada{border-color:var(--rosa);background:rgba(255,107,138,.09)}
  .alt.errada .letra{background:var(--rosa);color:var(--breu)}
  /* ---- explicação ---- */
  .explicacao{
    margin-top:20px;padding:18px;border-radius:11px;
    background:var(--breu);border-left:3px solid var(--ambar);
    font-size:15px;
  }
  .veredito{
    font-family:var(--display);font-weight:700;font-size:16px;
    display:block;margin-bottom:7px;
  }
  .veredito.ok{color:var(--menta)}
  .veredito.nao{color:var(--rosa)}
  .anima{animation:sobe .3s ease}
  @keyframes sobe{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .rodape-cartao{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
  /* ---- resultado ---- */
  .nota{
    font-family:var(--display);font-weight:800;
    font-size:clamp(52px,12vw,86px);line-height:1;letter-spacing:-.03em;
    margin:0 0 4px;
  }
  .nota.ok{color:var(--menta)} .nota.meio{color:var(--ambar)} .nota.nao{color:var(--rosa)}
  .detalhe{color:var(--bruma);font-size:14px;font-family:var(--mono)}
  .aviso{
    background:var(--placa);border:1.5px dashed var(--sulco);
    border-radius:14px;padding:24px;margin-top:16px;
  }
  .aviso h2{font-family:var(--display);font-size:19px;margin:0 0 10px}
  .aviso code{
    font-family:var(--mono);font-size:13px;background:var(--breu);
    padding:3px 7px;border-radius:5px;color:var(--ambar);
  }
  .aviso pre{
    font-family:var(--mono);font-size:13px;background:var(--breu);
    padding:14px;border-radius:9px;overflow-x:auto;color:var(--giz);
  }
  a{color:var(--ambar)}
  :focus-visible{outline:2px solid var(--ambar);outline-offset:3px;border-radius:6px}
  /* ---- mobile: a espinha vira faixa horizontal ---- */
  @media (max-width:720px){
    .casca{grid-template-columns:1fr;gap:18px;padding:22px 15px 60px}
    .espinha{
      position:static;flex-direction:row;flex-wrap:wrap;
      justify-content:flex-start;gap:5px;order:2;
    }
    .espinha .rotulo{display:none}
    .placar{margin:0 0 0 4px}
    .vertebra{width:22px;height:22px;font-size:10px;border-radius:6px}
    .cartao{padding:20px 17px}
    main{order:1}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="casca">
  <nav class="espinha" id="espinha" aria-label="Progresso das questões"></nav>

  <main>
    <header>
      <h1 class="marca">aws <em>do zero</em></h1>
      <p class="sub">Quiz dos módulos. Escolha o que estudou e responda.</p>
    </header>
    <div id="palco"></div>
  </main>
</div>

<script>
const RAIZ = "../questoes/";
let indice = [], selecionados = new Set(), fila = [], pos = 0, respostas = [], marcadas = new Set();

const palco = document.getElementById("palco");
const espinha = document.getElementById("espinha");
const letra = i => String.fromCharCode(97 + i);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

async function iniciar(){
  try{
    const r = await fetch(RAIZ + "indice.json");
    if(!r.ok) throw new Error("http " + r.status);
    indice = (await r.json()).modulos;
  }catch(e){
    return telaServidor();
  }
  for(const m of indice){
    try{
      const r = await fetch("../" + m.arquivo);
      m.questoes = r.ok ? (await r.json()).questoes.map(q => ({...q, _mod:m.codigo})) : [];
    }catch{ m.questoes = []; }
  }
  telaEscolha();
}

function telaServidor(){
  palco.innerHTML = `
    <div class="aviso">
      <h2>Abra esta página por um servidor</h2>
      <p>O navegador bloqueia a leitura de arquivos locais quando a página é aberta direto do disco
      (<code>file://</code>). Rode um servidor na raiz do repositório:</p>
      <pre>cd aws-do-zero
python3 -m http.server 8000</pre>
      <p>Depois acesse <a href="http://localhost:8000/web/">localhost:8000/web/</a>.</p>
      <p>Publicando no GitHub Pages (Settings → Pages → branch <code>main</code>, pasta <code>/</code>),
      a página funciona direto pela URL do Pages.</p>
    </div>`;
}

function telaEscolha(){
  espinha.innerHTML = "";
  const chips = indice.map(m => {
    const n = m.questoes.length;
    const on = selecionados.has(m.codigo);
    return `<button class="chip" data-mod="${m.codigo}" aria-pressed="${on}" ${n?"":"disabled"}
      title="${n?n+" questões":"banco ainda não escrito"}">${m.codigo} · ${esc(m.titulo)}${n?"":" ○"}</button>`;
  }).join("");
  const total = indice.filter(m=>selecionados.has(m.codigo)).reduce((s,m)=>s+m.questoes.length,0);
  palco.innerHTML = `
    <div class="modulos">${chips}</div>
    <p class="detalhe">${total} ${total===1?"questão selecionada":"questões selecionadas"}</p>
    <div class="acoes">
      <button class="botao" id="ir" ${total?"":"disabled"}>Começar</button>
      <button class="botao vazado" id="tudo">Selecionar tudo</button>
      <button class="botao vazado" id="simulado" ${total<10?"disabled":""}>Simulado de 65</button>
    </div>`;

  palco.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const k = b.dataset.mod;
    selecionados.has(k) ? selecionados.delete(k) : selecionados.add(k);
    telaEscolha();
  });
  document.getElementById("tudo").onclick = () => {
    indice.filter(m=>m.questoes.length).forEach(m => selecionados.add(m.codigo));
    telaEscolha();
  };
  document.getElementById("ir").onclick = () => comecar();
  document.getElementById("simulado").onclick = () => comecar(65);
}

function embaralhar(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function comecar(limite){
  fila = embaralhar(indice.filter(m=>selecionados.has(m.codigo)).flatMap(m=>m.questoes))
    .map(q => {
      const ordem = embaralhar([...q.alternativas.keys()]);
      const certas = new Set((Array.isArray(q.correta)?q.correta:[q.correta]));
      return {...q, _ordem:ordem, _certas:new Set(ordem.map((idx,p)=>certas.has(idx)?p:-1).filter(p=>p>=0))};
    });
  if(limite) fila = fila.slice(0, limite);
  pos = 0; respostas = [];
  mostrar();
}

function pintarEspinha(){
  espinha.innerHTML = `<span class="rotulo">Q</span>` + fila.map((_,i)=>{
    let cls = "vertebra";
    if(respostas[i]) cls += respostas[i].acertou ? " certa" : " errada";
    if(i===pos) cls += " atual";
    return `<span class="${cls}">${i+1}</span>`;
  }).join("") + `<span class="placar">${respostas.filter(r=>r&&r.acertou).length}/${respostas.filter(Boolean).length}</span>`;
}

function mostrar(){
  if(pos >= fila.length) return resultado();
  const q = fila[pos];
  marcadas = new Set();
  const multipla = q.multipla || q._certas.size > 1;
  pintarEspinha();

  palco.innerHTML = `
    <div class="cartao">
      <div class="meta">
        <span>${pos+1} / ${fila.length}</span>
        <span>módulo ${q._mod}</span>
        ${q.dominio?`<span>${esc(q.dominio)}</span>`:""}
        ${q.dificuldade?`<span>${esc(q.dificuldade)}</span>`:""}
        ${multipla?`<span style="color:var(--ambar)">múltipla escolha</span>`:""}
      </div>
      <h2 class="enunciado">${esc(q.enunciado)}</h2>
      <div class="alternativas" id="alts">
        ${q._ordem.map((idx,p)=>`
          <button class="alt" data-p="${p}">
            <span class="letra">${letra(p)}</span>
            <span>${esc(q.alternativas[idx])}</span>
          </button>`).join("")}
      </div>
      <div id="pos-resposta"></div>
    </div>`;

  palco.querySelectorAll(".alt").forEach(b => b.onclick = () => {
    const p = +b.dataset.p;
    if(multipla){
      marcadas.has(p) ? marcadas.delete(p) : marcadas.add(p);
      b.classList.toggle("marcada", marcadas.has(p));
      confirmarBotao(multipla);
    }else{
      marcadas = new Set([p]);
      revelar();
    }
  });
  if(multipla) confirmarBotao(multipla);
}

function confirmarBotao(){
  const area = document.getElementById("pos-resposta");
  area.innerHTML = `<div class="rodape-cartao">
    <button class="botao" id="conf" ${marcadas.size?"":"disabled"}>Confirmar resposta</button></div>`;
  document.getElementById("conf").onclick = revelar;
}

function revelar(){
  const q = fila[pos];
  const acertou = marcadas.size === q._certas.size && [...marcadas].every(p => q._certas.has(p));
  respostas[pos] = {acertou, id:q.id};
  pintarEspinha();

  palco.querySelectorAll(".alt").forEach(b => {
    const p = +b.dataset.p;
    b.disabled = true;
    b.classList.remove("marcada");
    if(q._certas.has(p)) b.classList.add("certa");
    else if(marcadas.has(p)) b.classList.add("errada");
  });

  const ultimo = pos === fila.length - 1;
  document.getElementById("pos-resposta").innerHTML = `
    <div class="explicacao anima">
      <span class="veredito ${acertou?"ok":"nao"}">${acertou?"Correto":"Errado"}</span>
      ${esc(q.explicacao)}
    </div>
    <div class="rodape-cartao">
      <button class="botao" id="prox">${ultimo?"Ver resultado":"Próxima"}</button>
      <button class="botao vazado" id="sair">Trocar de módulo</button>
    </div>`;
  document.getElementById("prox").onclick = () => { pos++; mostrar(); };
  document.getElementById("sair").onclick = () => { espinha.innerHTML=""; telaEscolha(); };
}

function resultado(){
  const feitas = respostas.filter(Boolean);
  const certas = feitas.filter(r=>r.acertou).length;
  const pct = Math.round(certas / feitas.length * 100);
  const faixa = pct >= 85 ? "ok" : pct >= 70 ? "meio" : "nao";
  const recado = pct >= 85
    ? "Pronto para a prova nesse conteúdo. Marque o módulo como concluído no progresso.md."
    : pct >= 70
      ? "Passaria, mas com pouca margem. Revise os erros antes de seguir."
      : "Ainda não. Volte à aula do módulo antes de repetir — refazer o quiz sem reestudar só treina o erro.";
  pos = fila.length; pintarEspinha();
  palco.innerHTML = `
    <div class="cartao">
      <p class="nota ${faixa}">${pct}%</p>
      <p class="detalhe">${certas} de ${feitas.length} · corte da prova real: 70%</p>
      <p style="margin-top:16px">${recado}</p>
      <div class="rodape-cartao">
        <button class="botao" id="refazer">Refazer só os erros</button>
        <button class="botao vazado" id="voltar">Escolher módulos</button>
      </div>
    </div>`;
  const errados = new Set(feitas.filter(r=>!r.acertou).map(r=>r.id));
  const bt = document.getElementById("refazer");
  if(!errados.size){ bt.disabled = true; bt.textContent = "Nenhum erro para refazer"; }
  else bt.onclick = () => { fila = embaralhar(fila.filter(q=>errados.has(q.id))); pos=0; respostas=[]; mostrar(); };
  document.getElementById("voltar").onclick = () => { espinha.innerHTML=""; telaEscolha(); };
}

iniciar();
</script>
</body>
</html>
