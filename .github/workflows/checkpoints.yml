name: Atualizar progresso dos checkpoints

on:
  issues:
    types: [opened, edited, reopened, closed, deleted, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  progresso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular progresso e atualizar PROGRESSO.md
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const TRILHAS = [
              { chave: 'Cloud',          rotulo: 'Certificação Cloud Practitioner', total: 17, cor: '00E582' },
              { chave: 'AI Practitioner',rotulo: 'Certificação AI Practitioner',    total: 14, cor: '41B3FF' },
              { chave: 'Aprofundado',    rotulo: 'Aprendizado Aprofundado',         total: 12, cor: 'FF9900' },
            ];

            // Extrai o valor de uma seção do body do issue form (### Heading\n\nvalue)
            function parseSection(body, heading) {
              // flexível com espaços, acentos e pontuação
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp('###\\s*' + escaped + '\\s*\\n+', 'i');
              const parts = body.split(re);
              if (parts.length < 2) return '';
              return parts[1].split(/\n###\s/)[0].trim();
            }

            // Busca issues: primeiro por label, fallback por título
            let issues = [];
            try {
              issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'checkpoint',
                state: 'all',
                per_page: 100,
              });
            } catch (e) {
              core.warning('Falha ao buscar por label: ' + e.message);
            }
            core.info(`Issues com label "checkpoint": ${issues.length}`);

            // Fallback: busca por título [Checkpoint] se label não retornou nada
            if (issues.length === 0) {
              core.info('Tentando fallback por título "[Checkpoint]"...');
              try {
                const todas = await github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all',
                  per_page: 100,
                });
                issues = todas.filter(i => !i.pull_request && (i.title || '').toLowerCase().includes('[checkpoint]'));
              } catch (e) {
                core.warning('Falha ao buscar todas as issues: ' + e.message);
              }
              core.info(`Issues encontradas por título: ${issues.length}`);
            }

            // aluno -> trilha -> Set(módulos)
            const alunos = new Map();
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const autor = issue.user.login;
              const corpo = (issue.body || '').replace(/\r\n/g, '\n');

              core.info(`--- Issue #${issue.number} por @${autor} ---`);

              // 1. Detectar trilha pela seção "Qual trilha?"
              const trilhaText = parseSection(corpo, 'Qual trilha\\?');
              core.info(`  Trilha (seção): "${trilhaText.substring(0, 80)}"`);

              // Match case-insensitive: primeiro na seção, fallback no corpo inteiro
              const textoTrilha = trilhaText || corpo;
              const trilha = TRILHAS.find(t =>
                textoTrilha.toLowerCase().includes(t.chave.toLowerCase())
              );
              if (!trilha) {
                core.warning(`  ⚠ Trilha não encontrada — pulando issue #${issue.number}`);
                continue;
              }
              core.info(`  Trilha detectada: ${trilha.rotulo}`);

              // 2. Extrair módulo — tenta heading exato, depois variações
              let modulo = parseSection(corpo, 'Módulo / Nível concluído');
              if (!modulo) modulo = parseSection(corpo, 'Módulo \\/ Nível concluído');
              if (!modulo) modulo = parseSection(corpo, 'Módulo');
              // fallback: regex genérico
              if (!modulo) {
                const fm = corpo.match(/m[oó]dulo\s*(?:\/\s*)?n[ií]vel\s*conclu[ií]do\s*\n+(.*?)(?:\n###|\n*$)/is);
                if (fm) modulo = fm[1].trim();
              }

              const moduloLimpo = (modulo || '').split('\n')[0].trim();
              core.info(`  Módulo: "${moduloLimpo}"`);

              if (!moduloLimpo || moduloLimpo === '_No response_') {
                core.warning(`  ⚠ Módulo vazio — pulando issue #${issue.number}`);
                continue;
              }

              if (!alunos.has(autor)) alunos.set(autor, new Map());
              const porTrilha = alunos.get(autor);
              if (!porTrilha.has(trilha.chave)) porTrilha.set(trilha.chave, new Set());
              porTrilha.get(trilha.chave).add(moduloLimpo.toLowerCase());
              core.info(`  ✅ Registrado: ${trilha.rotulo} · ${moduloLimpo}`);
            }

            const barra = (feitos, total) => {
              const blocos = 24;
              const cheios = total ? Math.round((feitos / total) * blocos) : 0;
              return '█'.repeat(cheios) + '░'.repeat(blocos - cheios);
            };

            const linhasAluno = (porTrilha) => TRILHAS.map(t => {
              const feitos = (porTrilha.get(t.chave) || new Set()).size;
              const pct = t.total ? Math.round((feitos / t.total) * 100) : 0;
              return `| ${t.rotulo} | \`${barra(feitos, t.total)}\` | ${feitos}/${t.total} | ${pct}% |`;
            }).join('\n');

            const cabecalho = '| Trilha | Progresso | Módulos | % |\n|:--|:--|:--:|:--:|';

            // ---------- PROGRESSO.md ----------
            const ordenados = [...alunos.entries()].sort((a, b) => {
              const soma = m => [...m.values()].reduce((s, set) => s + set.size, 0);
              return soma(b[1]) - soma(a[1]);
            });

            let md = `<div align="center">\n\n<img src="./assets/progresso.png" alt="Progresso das trilhas" width="100%" />\n\n# 📊 Progresso da turma\n\n<sub>Atualizado automaticamente a cada checkpoint registrado · ${new Date().toISOString().slice(0,10)}</sub>\n\n</div>\n\n---\n\n`;

            if (!ordenados.length) {
              md += 'Ninguém registrou checkpoint ainda. Seja a primeira pessoa: [abrir checkpoint](../../issues/new?template=checkpoint-de-modulo.yml) 🚀\n';
            } else {
              md += '## 🏆 Ranking\n\n| # | Aluno(a) | Módulos concluídos |\n|:--:|:--|:--:|\n';
              ordenados.forEach(([login, porTrilha], i) => {
                const soma = [...porTrilha.values()].reduce((s, set) => s + set.size, 0);
                md += `| ${i + 1} | [@${login}](https://github.com/${login}) | ${soma} |\n`;
              });
              md += '\n---\n\n## 📈 Detalhe por pessoa\n\n';
              for (const [login, porTrilha] of ordenados) {
                md += `### [@${login}](https://github.com/${login})\n\n${cabecalho}\n${linhasAluno(porTrilha)}\n\n`;
              }
            }
            md += '\n---\n\n<div align="center">\n\n🏠 [Voltar ao início](./README.md)\n\n</div>\n';
            fs.writeFileSync('PROGRESSO.md', md);

            // ---------- comentário na issue ----------
            if (context.payload.issue && ['opened', 'edited', 'reopened'].includes(context.payload.action)) {
              const login = context.payload.issue.user.login;
              const porTrilha = alunos.get(login);
              if (porTrilha) {
                const soma = [...porTrilha.values()].reduce((s, set) => s + set.size, 0);
                const corpo = [
                  `### 📊 Progresso de @${login}`,
                  '',
                  cabecalho,
                  linhasAluno(porTrilha),
                  '',
                  `**${soma} módulos concluídos.** Veja a turma inteira em [PROGRESSO.md](../blob/main/PROGRESSO.md). Bora construir! 🚀`,
                ].join('\n');

                const comentarios = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.payload.issue.number, per_page: 100,
                });
                const meu = comentarios.find(c => c.user.type === 'Bot' && c.body.includes('### 📊 Progresso de'));
                if (meu) {
                  await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: meu.id, body: corpo });
                } else {
                  await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, body: corpo });
                }
              }
            }

      - name: Commitar PROGRESSO.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROGRESSO.md
          git diff --staged --quiet || git commit -m "chore: atualiza progresso dos checkpoints"
          git push
