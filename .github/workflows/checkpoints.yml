name: Atualizar progresso dos checkpoints

# Recalcula o progresso da turma, valida presenças em eventos e publica os
# perfis públicos (membros/). A lógica mora em .github/scripts/perfis.js.

on:
  issues:
    types: [opened, edited, reopened, closed, deleted, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  progresso:
    if: ${{ !startsWith(github.event.issue.title, '[Simulado do Mês]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular progresso, presenças e perfis
        uses: actions/github-script@v7
        with:
          script: |
            const atualizar = require('./.github/scripts/perfis.js');
            await atualizar({ github, context, core });

      - name: Commitar PROGRESSO.md e perfis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROGRESSO.md membros
          git diff --staged --quiet && exit 0
          git commit -m "chore: atualiza progresso e perfis"
          # Outra automação pode ter commitado no meio do caminho: rebase e tenta de novo.
          for tentativa in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
