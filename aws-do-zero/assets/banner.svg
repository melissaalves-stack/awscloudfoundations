<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="aws do zero">
  <defs>
    <linearGradient id="fundo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16132A"/>
      <stop offset="55%" stop-color="#211D3C"/>
      <stop offset="100%" stop-color="#16132A"/>
      <animate attributeName="x1" values="0%;30%;0%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;70%;100%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFB03A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFB03A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="corte"><rect x="0" y="0" width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#corte)">
    <rect width="1200" height="300" fill="url(#fundo)"/>
    <circle cx="960" cy="90" r="220" fill="url(#glow)">
      <animate attributeName="r" values="200;240;200" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- grade de circuito sutil -->
    <g stroke="#352F5C" stroke-width="1" opacity="0.5">
      <path d="M0 250 H1200"/>
      <path d="M0 260 H1200"/>
    </g>

    <!-- nuvens flutuantes / pacotes de dados subindo o pipeline -->
    <g fill="#5FE3A8">
      <circle cx="80" cy="60" r="4">
        <animate attributeName="cx" values="60;1140;60" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#FF6B8A">
      <circle cx="80" cy="255" r="3.5">
        <animate attributeName="cx" values="40;1160;40" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#FFB03A">
      <circle cx="80" cy="255" r="3.5">
        <animate attributeName="cx" values="20;1180;20" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- marca -->
    <text x="60" y="140" font-family="Segoe UI, system-ui, sans-serif" font-weight="800" font-size="64" fill="#EDE9FA" letter-spacing="-1">
      aws do <tspan fill="#FFB03A">zero</tspan>
    </text>

    <!-- linha mono com efeito de digitação -->
    <g font-family="Consolas, 'IBM Plex Mono', ui-monospace, monospace" font-size="19" fill="#948CBB">
      <text x="62" y="178">CLF-C02 · AIF-C01 · 16 módulos · ~63h de laboratório</text>
      <rect x="62" y="163" width="560" height="22" fill="#16132A">
        <animate attributeName="width" values="560;0;0;560;560" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="60" y="163" width="3" height="22" fill="#FFB03A">
        <animate attributeName="x" values="62;620;620;62;62" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- trilha de progresso: 4 níveis acendendo em sequência -->
    <g transform="translate(60,215)">
      <text x="0" y="-8" font-family="Consolas, 'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#948CBB" letter-spacing="1">FUNDAMENTOS → BLOCOS → OPERAÇÃO → IA</text>
      <g>
        <rect x="0" y="0" width="255" height="10" rx="5" fill="#352F5C"/>
        <rect x="265" y="0" width="255" height="10" rx="5" fill="#352F5C"/>
        <rect x="530" y="0" width="255" height="10" rx="5" fill="#352F5C"/>
        <rect x="795" y="0" width="255" height="10" rx="5" fill="#352F5C"/>

        <rect x="0" y="0" width="255" height="10" rx="5" fill="#5FE3A8">
          <animate attributeName="opacity" values="0.15;1;1;0.15" keyTimes="0;0.05;0.22;0.27" dur="8s" repeatCount="indefinite"/>
        </rect>
        <rect x="265" y="0" width="255" height="10" rx="5" fill="#5FE3A8">
          <animate attributeName="opacity" values="0.15;0.15;1;1;0.15" keyTimes="0;0.27;0.32;0.49;0.54" dur="8s" repeatCount="indefinite"/>
        </rect>
        <rect x="530" y="0" width="255" height="10" rx="5" fill="#FFB03A">
          <animate attributeName="opacity" values="0.15;0.15;1;1;0.15" keyTimes="0;0.54;0.59;0.76;0.81" dur="8s" repeatCount="indefinite"/>
        </rect>
        <rect x="795" y="0" width="255" height="10" rx="5" fill="#FF6B8A">
          <animate attributeName="opacity" values="0.15;0.15;1;1" keyTimes="0;0.81;0.86;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#352F5C"/>
  </g>
</svg>
